<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-fm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4F0"/>
      <stop offset="100%" stop-color="#D4E5DE"/>
    </linearGradient>
    <linearGradient id="shawl-grad-fm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D483A"/>
      <stop offset="100%" stop-color="#082A22"/>
    </linearGradient>
    <linearGradient id="accent-grad-fm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A145"/>
      <stop offset="100%" stop-color="#C9862C"/>
    </linearGradient>
    <filter id="shadow-fm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#07261E" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="460" fill="url(#bg-grad-fm)"/>
  
  <!-- Subtle Architectural Arch Pattern in Background -->
  <path d="M 60 460 L 60 200 C 60 110, 340 110, 340 200 L 340 460 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6"/>
  <circle cx="200" cy="90" r="4" fill="#C9862C" opacity="0.8"/>

  <!-- Character Silhouette / Professional Portrait -->
  <g filter="url(#shadow-fm)">
    <!-- Shoulders & Blazer / Modest Attire -->
    <path d="M 70 460 C 70 365, 115 325, 160 310 L 240 310 C 285 325, 330 365, 330 460 Z" fill="url(#shawl-grad-fm)"/>
    <!-- Collar / Inner Top -->
    <path d="M 170 310 L 200 355 L 230 310 Z" fill="#FAF9F6"/>
    <!-- Brooch / Foundation Pin -->
    <circle cx="200" cy="355" r="5.5" fill="url(#accent-grad-fm)"/>

    <!-- Headscarf / Professional Drapery -->
    <path d="M 125 210 C 120 120, 280 120, 275 210 C 275 270, 260 305, 200 312 C 140 305, 125 270, 125 210 Z" fill="#135E4D"/>
    
    <!-- Face Contour -->
    <path d="M 152 205 C 152 165, 248 165, 248 205 C 248 250, 230 272, 200 275 C 170 272, 152 250, 152 205 Z" fill="#FCEBD9"/>

    <!-- Soft Facial Features / Minimalist Aesthetic -->
    <!-- Eyes / Eyebrows -->
    <path d="M 168 195 Q 178 190 188 195" stroke="#422918" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M 212 195 Q 222 190 232 195" stroke="#422918" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    
    <path d="M 172 204 Q 178 200 184 204" stroke="#422918" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 216 204 Q 222 200 228 204" stroke="#422918" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Soft Smile -->
    <path d="M 188 238 Q 200 246 212 238" stroke="#A85741" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Elegant Bottom Glass Bar with Designation -->
  <rect x="24" y="396" width="352" height="46" rx="8" fill="#FFFFFF" opacity="0.95"/>
  <rect x="24" y="396" width="352" height="46" rx="8" fill="none" stroke="#D1DDD7" stroke-width="1"/>
  <text x="40" y="420" font-family="'Poppins', sans-serif" font-weight="600" font-size="13" fill="#0D483A">Fathimath Mufeedha</text>
  <text x="40" y="433" font-family="'Poppins', sans-serif" font-weight="500" font-size="9.5" fill="#C9862C" letter-spacing="0.08em">PRESIDENT · PHARM.D</text>
  <circle cx="354" cy="419" r="6" fill="#0D483A"/>
  <path d="M 351 419 L 353 421 L 357 417" stroke="#FFFFFF" stroke-width="1.4" fill="none" stroke-linecap="round"/>
</svg>


<svg class="hero-wireframe-svg" viewBox="0 0 1440 480" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <!-- Aroham Warm Ochre Gold Gradient (Left Ridge) -->
    <linearGradient id="ochreWaveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B87B1D" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#DF9C2C" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FDE047" stop-opacity="1" />
    </linearGradient>

    <!-- Aroham Forest Pine / Emerald Mint Gradient (Right Ridge) -->
    <linearGradient id="pineWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="1" />
      <stop offset="40%" stop-color="#14B8A6" stop-opacity="0.95" />
      <stop offset="85%" stop-color="#154840" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0B2C27" stop-opacity="0.75" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

